<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MiniApp Bi (Isolated Attacker)</title>
    <!-- 인라인 스크립트 실행 방어 및 외부 자원 로드 차단 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #fce4ec; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #e91e63; color: white; border: none; border-radius: 5px; }
        .stolen { margin-top: 20px; padding: 10px; border: 2px solid red; background: white; color: red; font-weight: bold; white-space: pre-line; }
    </style>
    
    <script>
        /* [핵심] 슈퍼앱의 미니앱 엔진 모사 프레임워크 */
        window.getApp = null;
        
        window.App = function(config) {
            window.getApp = () => config;
            if(config.onLaunch) config.onLaunch();
        };

        window.Page = function(config) {
            document.addEventListener("DOMContentLoaded", function() {
                if(config.onLoad) config.onLoad();
                
                // HTML의 버튼(stealBtn)을 찾아 Page 객체의 함수와 연결
                const btn = document.getElementById('stealBtn');
                if(btn && config.onMyFunc) {
                    btn.addEventListener('click', config.onMyFunc);
                }
            });
        };
    </script>
</head>
<body>
    <h1>MiniApp Bi (Attacker - Blocked)</h1>
    <p>격리된 환경(Sandbox)에서 Ai의 데이터를 탈취하려고 시도합니다.</p>
    
    <button id="stealBtn">타 앱 데이터 탈취 시도</button>
    <div class="stolen" id="result">결과: 아직 탈취 전</div>

    <script src="app.js"></script>
    <script src="index.js"></script>
</body>
</html>
